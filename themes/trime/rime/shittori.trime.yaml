    send: Control+Shift+Alt+v
  share_text:
    label: 分享文本
    send: Control+Alt+s
  redo:
    label: 重做
    send: Control+Shift+z
  undo:
    label: 撤销
    send: Control+z
  F4:
    label: 方案選單
    send: F4
