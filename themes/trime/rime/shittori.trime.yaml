  CommitRawInput:
    label: 編碼
    send: Control+Return
  CommitScriptText:
    label: 編碼
    send: Shift+Return
  CommitComment:
    label: 編碼
    send: Control+Shift+Return
  DeleteCandidate:
    label: 刪詞
    send: Control+Delete
  Mode_switch:
    toggle: ascii_mode
    send: SWITCH_CHARSET
    states:
    - 中文
    - 西文
  Zenkaku_Hankaku:
    toggle: full_shape
    send: SWITCH_CHARSET
    states:
    - 半角
    - 全角
  Henkan:
    toggle: simplification
    send: SWITCH_CHARSET
    states:
    - 漢字
    - 汉字
  Charset_switch:
    toggle: extended_charset
    send: SWITCH_CHARSET
    states:
    - 常用
    - 增廣
  Punct_switch:
    toggle: ascii_punct
    send: SWITCH_CHARSET
    states:
