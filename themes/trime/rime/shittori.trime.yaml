    send: Down
    repeatable: true
  Up:
    label: ↑
    send: Up
    repeatable: true
  Right:
    label: →
    send: Right
    repeatable: true
  select_all:
    label: 全选
    send: Control+a
  Clear:
    label: 清除
    text: '{Control+a}{BackSpace}'
  cut:
    label: 剪切
    send: Control+x
  cut_all:
    label: 全挪
    text: '{Control+a}{Control+x}'
  copy:
    label: 复制
    send: Control+c
  copy_all:
    label: 全謄
    text: '{Control+a}{Control+c}'
  paste:
