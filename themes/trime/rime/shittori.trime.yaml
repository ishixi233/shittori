# Trime 3.3.12 / Shittori compact. Native toolbar; no modified APK.
style:
  auto_caps: false
  candidate_font: []
  candidate_padding: 8
  candidate_spacing: 0
  candidate_text_size: 17
  candidate_text_vertical_bias: 1.0
  candidate_view_height: 34
  comment_font: []
  comment_height: 12
  comment_position: top
  comment_vertical_bias: 0.0
  comment_text_size: 9
  hanb_font: []
  horizontal_gap: 4
  keyboard_padding: 6
  keyboard_padding_left: 0
  keyboard_padding_right: 40
  keyboard_padding_bottom: 4
  keyboard_padding_land: 28
  keyboard_padding_land_bottom: 4
  key_font: []
  key_height: 56
  key_long_text_size: 14
  key_text_size: 17
  key_width: 10
  label_text_size: 11
  label_font:
  - JetBrainsMono-Regular.ttf
  latin_font: []
  keyboard_height: 224
  keyboard_height_land: 176
  preview_font: []
  preview_height: 60
  preview_offset: -12
  preview_text_size: 40
  reset_ascii_mode_on_focus_change: false
  round_corner: 12
  shadow_radius: 0
  symbol_font: []
  symbol_text_size: 8
  text_font: []
  vertical_gap: 5
  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: 换行
  candidate_corner_radius: 9
fallback_colors:
  candidate_text_color: text_color
preset_keys:
