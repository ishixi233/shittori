liquid_keyboard:
  author: tumuyan
  row: 6
  row_land: 5
  key_height: 40
  key_height_land: 40
  single_width: 60
  vertical_gap: 1
  margin_x: 5
  fixed_key_bar:
    position: bottom
    keys:
    - liquid_keyboard_exit
    - space1
    - BackSpace
    - Return2
    - clipboard_window
    - liquid_keyboard_switch
  keyboards:
  - emoji
  - math
  - ascii
  - cn
  - history
  - symbollist
  - list
  - ids
  - symbol
  - tabs
  - pinyin
  - script_symbols
  - jp
  - grease
  - rusa
  - korea
  - lation
  - yinbiao
  - unit
  - yanwenzi
  - combing
  - emoji_full
  tabs:
    name: 更多
    type: TABS
  history:
    name: 常用
    type: HISTORY
  emoji:
    type: SINGLE
    keys: 🙂😂🤣😆🙃😅🥺😎👀🙈🙉🙊☹😑😄🤐😨😱🌚🌝🤔❤💔🌹💣👌👍😣😥😮🙄😏😕😯😪😫😴😌🤑😉😋😎😍😘😚😛😜😝😒😓😔😲😷🤒😇🤓🤗🤕🙁😖😞😟😤😢😭😦😧😨😩😬😰😳😵😡😠☝✌🖕👎🙏🤘👏💪💋☘🍀🌸☕🍵🍺🍻🍦🍬🍚🍜🍲🍖🎂💤
  emoji_full:
